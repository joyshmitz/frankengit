# Temporary transport for this native implementation session. The consumer is
# the offline native rebase compiler/test run; remove after that run is retained.
# No credentials, Git directory, mutable provider state or build results travel.
name: Exact native development inputs
on:
  push:
    branches: [main]
    paths: [.github/workflows/source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retain the exact compiler and locked public registry inputs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fg-native-input"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/revision.txt"
          rustc -Vv > "$out/rustc.txt"
          cargo fetch --locked
          sysroot="$(rustc --print sysroot)"
          tar -C "$sysroot" --exclude=share/doc -czf "$out/toolchain.tar.gz" .
          tar -C "${CARGO_HOME:-$HOME/.cargo}" -czf "$out/registry.tar.gz" registry
          git archive --format=tar.gz --output="$out/source.tar.gz" HEAD
          (cd "$out" && sha256sum toolchain.tar.gz registry.tar.gz source.tar.gz > checksums.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-development-${{ github.sha }}
          path: ${{ runner.temp }}/fg-native-input
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
